<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video feed | JOSH</title>
    <meta name="description" content="Watch what JOSH creators are publishing right now." />
    <link rel="stylesheet" href="/assets/css/platform.css" />
    <script type="module" src="/assets/js/app.js"></script>
  </head>
  <body data-page="feed" data-nav="/feed">
    <header>
      <div class="container">
        <nav>
          <a class="brand" href="/"><span class="brand-mark">J</span><span>JOSH</span></a>
          <div class="nav-links">
            <a href="/feed">Feed</a>
            <a href="/live">Live</a>
            <a href="/studio">Studio</a>
            <a href="/earnings">Earnings</a>
          </div>
          <div class="nav-auth" id="nav-auth"></div>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="page-head">
        <div>
          <p class="eyebrow">JOSH video</p>
          <h1>What creators are publishing</h1>
          <p class="muted" style="margin:0;">
            Every number below is measured from real activity on this platform.
          </p>
        </div>
        <a class="button primary" href="/upload">Upload video</a>
      </div>

      <div class="stats" id="feed-stats"></div>

      <div class="row" style="margin:26px 0 18px;">
        <input
          id="feed-search"
          type="search"
          placeholder="Search videos…"
          aria-label="Search videos"
          style="max-width: 360px;"
        />
      </div>

      <div class="video-grid" id="feed-grid" aria-live="polite"></div>
    </main>

    <footer class="page">
      <div class="container small muted">© 2026 JOSH · Built for momentum</div>
    </footer>
  </body>
</html>
